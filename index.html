<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Money Diary</title>
  <meta name="theme-color" content="#166534">
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#17202a;background:#f3f7f4}
    *{box-sizing:border-box} body{margin:0} .wrap{max-width:760px;margin:auto;padding:18px}
    header{background:#166534;color:white;padding:22px 18px;border-radius:18px;margin:10px 0 18px}
    h1{margin:0 0 5px;font-size:1.8rem} header p{margin:0;opacity:.9}
    .card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #173b2510}
    h2{font-size:1.15rem;margin:0 0 14px}
    label{display:block;font-size:.9rem;font-weight:600;margin:10px 0 5px}
    input,select,button{font:inherit;width:100%;padding:12px;border:1px solid #cbd5cf;border-radius:10px}
    button{border:0;background:#166534;color:white;font-weight:700;margin-top:12px;cursor:pointer}
    button.secondary{background:#e5eee7;color:#17452a} button.danger{background:#a61b1b}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .stat{background:#edf7ef;padding:13px;border-radius:12px;overflow-wrap:anywhere}
    .stat small{display:block;color:#52645a}.stat strong{font-size:1.1rem}
    .entry{padding:12px 0;border-bottom:1px solid #e5eae6;display:flex;gap:12px;justify-content:space-between}
    .entry:last-child{border-bottom:0}.muted{color:#64746a;font-size:.9rem}
    .hidden{display:none!important}.message{padding:10px;border-radius:10px;margin:10px 0;background:#fff3cd;color:#6b5200}
    .success{background:#e1f6e7;color:#155b2b}.error{background:#ffe5e5;color:#8c1717}
    .amount{font-weight:800;white-space:nowrap}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .topline button{width:auto;margin:0;padding:9px 12px}
    @media(max-width:520px){.row,.stats{grid-template-columns:1fr}.wrap{padding:12px}.stat{display:flex;justify-content:space-between;align-items:center}}
  </style>
</head>
<body>
<div class="wrap">
  <header><h1>💰 Money Diary</h1><p>अपने खर्चों का आसान हिसाब रखें</p></header>
  <div id="message" class="message hidden" role="status"></div>

  <section id="authCard" class="card">
    <h2 id="authTitle">अपने खाते में लॉगिन करें</h2>
    <label for="email">ईमेल</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com">
    <label for="password">पासवर्ड</label><input id="password" type="password" autocomplete="current-password" placeholder="पासवर्ड">
    <button id="loginBtn">लॉगिन</button>
    <button id="signupBtn" class="secondary">नया अकाउंट बनाएँ</button>
    <button id="resetBtn" class="secondary">पासवर्ड रीसेट करें</button>
  </section>

  <main id="app" class="hidden">
    <section class="card">
      <div class="topline"><h2>आपका हिसाब</h2><button id="logoutBtn" class="secondary">लॉगआउट</button></div>
      <p class="muted" id="userLabel"></p>
      <div class="stats">
        <div class="stat"><small>कुल खर्च</small><strong id="total">₹0</strong></div>
        <div class="stat"><small>इस महीने</small><strong id="monthly">₹0</strong></div>
        <div class="stat"><small>खर्चों की संख्या</small><strong id="count">0</strong></div>
      </div>
    </section>

    <section class="card">
      <h2>नया खर्च जोड़ें</h2>
      <form id="expenseForm">
        <div class="row">
          <div><label for="amount">राशि (₹)</label><input id="amount" type="number" min="0.01" step="0.01" required placeholder="जैसे 120"></div>
          <div><label for="date">तारीख</label><input id="date" type="date" required></div>
        </div>
        <div class="row">
          <div><label for="category">कैटेगरी</label>
            <select id="category"><option>खाना</option><option>यात्रा</option><option>घर</option><option>बिल</option><option>शिक्षा</option><option>स्वास्थ्य</option><option>शॉपिंग</option><option>मनोरंजन</option><option>अन्य</option></select>
          </div>
          <div><label for="title">खर्च का नाम</label><input id="title" required maxlength="80" placeholder="जैसे दूध"></div>
        </div>
        <label for="note">नोट (वैकल्पिक)</label><input id="note" maxlength="200" placeholder="कोई अतिरिक्त जानकारी">
        <button id="saveBtn" type="submit">खर्च सेव करें</button>
      </form>
    </section>

    <section class="card">
      <h2>खर्चों की सूची</h2>
      <div class="row">
        <div><label for="filterCategory">कैटेगरी फ़िल्टर</label><select id="filterCategory"><option value="">सभी कैटेगरी</option><option>खाना</option><option>यात्रा</option><option>घर</option><option>बिल</option><option>शिक्षा</option><option>स्वास्थ्य</option><option>शॉपिंग</option><option>मनोरंजन</option><option>अन्य</option></select></div>
        <div><label for="filterMonth">महीना फ़िल्टर</label><input id="filterMonth" type="month"></div>
      </div>
      <button id="exportBtn" class="secondary" type="button">CSV डाउनलोड करें</button>
      <div id="entries" class="muted" style="margin-top:12px">खर्च लोड हो रहे हैं…</div>
    </section>
  </main>
  <p class="muted">आपके खर्च आपके Firebase खाते में सेव होते हैं। अपने खाते का पासवर्ड किसी के साथ साझा न करें।</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(() => {
  const firebaseConfig = {
    apiKey: "AIzaSyAo2PkHTqHO4ZEwHrfzPjf8y1oHdbluHEg",
    authDomain: "money-diary-385f8.firebaseapp.com",
    databaseURL: "https://money-diary-385f8-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "money-diary-385f8",
    storageBucket: "money-diary-385f8.firebasestorage.app",
    messagingSenderId: "614681684176",
    appId: "1:614681684176:web:e1b27e4f4e6cc5e75d56d5",
    measurementId: "G-PG3TQ5RTQ7"
  };

  const $ = id => document.getElementById(id);
  let auth, db, currentUser = null, expenses = [], listenerRef = null;
  const msg = (text, type='') => { $('message').textContent=text; $('message').className='message '+type; };
  const clearMsg = () => $('message').className='message hidden';
  const money = n => '₹' + Number(n || 0).toLocaleString('en-IN',{maximumFractionDigits:2});
  const localToday = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    auth = firebase.auth(); db = firebase.database();
    $('date').value = localToday();
  } catch (e) {
    msg('Firebase शुरू नहीं हो पाया। इंटरनेट और Firebase config जाँचें। '+e.message, 'error');
    return;
  }

  $('loginBtn').addEventListener('click', async () => {
    clearMsg();
    try { await auth.signInWithEmailAndPassword($('email').value.trim(), $('password').value); }
    catch(e) { msg(authError(e), 'error'); }
  });
  $('signupBtn').addEventListener('click', async () => {
    clearMsg();
    const email=$('email').value.trim(), password=$('password').value;
    if(password.length < 6) return msg('पासवर्ड कम से कम 6 अक्षर का रखें।','error');
    try { await auth.createUserWithEmailAndPassword(email,password); msg('अकाउंट बन गया।','success'); }
    catch(e) { msg(authError(e), 'error'); }
  });
  $('resetBtn').addEventListener('click', async () => {
    clearMsg(); const email=$('email').value.trim();
    if(!email) return msg('पहले ईमेल भरें।','error');
    try { await auth.sendPasswordResetEmail(email); msg('पासवर्ड रीसेट ईमेल भेज दिया गया।','success'); }
    catch(e) { msg(authError(e), 'error'); }
  });
  $('logoutBtn').addEventListener('click', () => auth.signOut());
  $('expenseForm').addEventListener('submit', async e => {
    e.preventDefault(); clearMsg();
    if(!currentUser) return msg('पहले लॉगिन करें।','error');
    const amount=Number($('amount').value), title=$('title').value.trim(), date=$('date').value;
    if(!Number.isFinite(amount) || amount<=0 || !title || !date) return msg('राशि, तारीख और खर्च का नाम सही भरें।','error');
    $('saveBtn').disabled=true;
    try {
      await db.ref(`users/${currentUser.uid}/expenses`).push({
        amount, title, category:$('category').value, date,
        note:$('note').value.trim(), createdAt: firebase.database.ServerValue.TIMESTAMP
      });
      $('expenseForm').reset(); $('date').value=localToday();
      msg('खर्च Firebase में सेव हो गया।','success');
    } catch(e) { msg('खर्च सेव नहीं हुआ: '+e.message,'error'); }
    finally { $('saveBtn').disabled=false; }
  });
  $('filterCategory').addEventListener('change', render);
  $('filterMonth').addEventListener('input', render);
  $('exportBtn').addEventListener('click', exportCSV);

  auth.onAuthStateChanged(user => {
    currentUser=user;
    $('authCard').classList.toggle('hidden',!!user);
    $('app').classList.toggle('hidden',!user);
    if(listenerRef) { listenerRef.off(); listenerRef=null; }
    expenses=[];
    if(!user) { render(); return; }
    $('userLabel').textContent='लॉगिन: '+user.email;
    listenerRef=db.ref(`users/${user.uid}/expenses`);
    listenerRef.on('value', snapshot => {
      expenses=[];
      snapshot.forEach(child => expenses.push({id:child.key,...child.val()}));
      expenses.sort((a,b)=>(b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
      render();
    }, error => msg('डेटा लोड नहीं हुआ: '+error.message,'error'));
  });

  function render() {
    const total=expenses.reduce((s,e)=>s+Number(e.amount||0),0);
    const month=localToday().slice(0,7);
    const monthly=expenses.filter(e=>(e.date||'').slice(0,7)===month).reduce((s,e)=>s+Number(e.amount||0),0);
    $('total').textContent=money(total); $('monthly').textContent=money(monthly); $('count').textContent=expenses.length;
    const cat=$('filterCategory').value, m=$('filterMonth').value;
    const list=expenses.filter(e=>(!cat||e.category===cat)&&(!m||(e.date||'').startsWith(m)));
    const root=$('entries'); root.replaceChildren();
    if(!list.length) { root.textContent='अभी कोई खर्च नहीं है।'; root.className='muted'; return; }
    root.className='';
    list.forEach(e => {
      const row=document.createElement('div'); row.className='entry';
      const left=document.createElement('div');
      const title=document.createElement('strong'); title.textContent=e.title||'खर्च';
      const details=document.createElement('div'); details.className='muted'; details.textContent=`${e.category||'अन्य'} • ${e.date||''}${e.note?' • '+e.note:''}`;
      left.append(title,details);
      const right=document.createElement('div'); right.style.textAlign='right';
      const amount=document.createElement('div'); amount.className='amount'; amount.textContent=money(e.amount);
      const del=document.createElement('button'); del.className='danger'; del.type='button'; del.textContent='डिलीट'; del.style.width='auto'; del.style.padding='6px 10px'; del.style.marginTop='6px';
      del.addEventListener('click',async()=>{ if(confirm('क्या यह खर्च डिलीट करना है?')) { try { await db.ref(`users/${currentUser.uid}/expenses/${e.id}`).remove(); msg('खर्च डिलीट हो गया।','success'); } catch(err){msg('डिलीट नहीं हुआ: '+err.message,'error');} } });
      right.append(amount,del); row.append(left,right); root.append(row);
    });
  }

  function exportCSV() {
    const cat=$('filterCategory').value, m=$('filterMonth').value;
    const list=expenses.filter(e=>(!cat||e.category===cat)&&(!m||(e.date||'').startsWith(m)));
    const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
    const csv='\uFEFF'+[['Date','Title','Category','Amount','Note'],...list.map(e=>[e.date,e.title,e.category,e.amount,e.note])].map(r=>r.map(q).join(',')).join('\r\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download='money-diary-expenses.csv'; a.click(); URL.revokeObjectURL(url);
  }
  function authError(e) {
    const codes={'auth/invalid-email':'ईमेल सही नहीं है।','auth/user-not-found':'इस ईमेल का अकाउंट नहीं मिला।','auth/wrong-password':'पासवर्ड गलत है।','auth/invalid-credential':'ईमेल या पासवर्ड सही नहीं है।','auth/email-already-in-use':'इस ईमेल से अकाउंट पहले से बना है।','auth/weak-password':'पासवर्ड कम से कम 6 अक्षर का रखें।','auth/too-many-requests':'बहुत कोशिशें हुईं। थोड़ी देर बाद प्रयास करें।','auth/network-request-failed':'इंटरनेट कनेक्शन जाँचें।','auth/operation-not-allowed':'Firebase में Email/Password sign-in सक्षम करें।'};
    return codes[e.code] || ('समस्या: '+(e.message||'फिर कोशिश करें।'));
  }
})();
</script>
</body>
</html>
